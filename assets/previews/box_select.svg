<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Box Select (B)</text>

  <!-- Items -->
  <circle cx="60" cy="60" r="10" fill="#ccc"/>
  <circle cx="100" cy="50" r="10" fill="#ccc"/>
  <circle cx="40" cy="100" r="10" fill="#ccc"/>
  
  <!-- Selected Items -->
  <circle cx="100" cy="100" r="10" fill="#FF5722"/>
  <circle cx="140" cy="80" r="10" fill="#FF5722"/>
  <circle cx="120" cy="130" r="10" fill="#FF5722"/>

  <!-- Selection Box -->
  <rect x="80" y="70" width="80" height="80" fill="#FF5722" fill-opacity="0.1" stroke="#FF5722" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Cursor -->
  <path d="M160,150 L160,165 L150,165" fill="none" stroke="#333" stroke-width="2"/>
</svg>
