<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="animated-preview">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Select More (Ctrl+Num+)</text>
  
  <g transform="translate(100,100)">
      <!-- 5x5 Grid representation -->
      <g stroke="#ddd" stroke-width="1" fill="none">
          <rect x="-50" y="-50" width="20" height="20"/> <rect x="-30" y="-50" width="20" height="20"/> <rect x="-10" y="-50" width="20" height="20"/> <rect x="10" y="-50" width="20" height="20"/> <rect x="30" y="-50" width="20" height="20"/>
          <rect x="-50" y="-30" width="20" height="20"/> <rect x="-30" y="-30" width="20" height="20"/> <rect x="-10" y="-30" width="20" height="20"/> <rect x="10" y="-30" width="20" height="20"/> <rect x="30" y="-30" width="20" height="20"/>
          <rect x="-50" y="-10" width="20" height="20"/> <rect x="-30" y="-10" width="20" height="20"/> <rect x="-10" y="-10" width="20" height="20"/> <rect x="10" y="-10" width="20" height="20"/> <rect x="30" y="-10" width="20" height="20"/>
          <rect x="-50" y="10" width="20" height="20"/>  <rect x="-30" y="10" width="20" height="20"/>  <rect x="-10" y="10" width="20" height="20"/>  <rect x="10" y="10" width="20" height="20"/>  <rect x="30" y="10" width="20" height="20"/>
          <rect x="-50" y="30" width="20" height="20"/>  <rect x="-30" y="30" width="20" height="20"/>  <rect x="-10" y="30" width="20" height="20"/>  <rect x="10" y="30" width="20" height="20"/>  <rect x="30" y="30" width="20" height="20"/>
      </g>

      <!-- Center -->
      <rect x="-10" y="-10" width="20" height="20" fill="#FF9800" opacity="0.8" class="sel-level-1"/>
      
      <!-- Ring 1 -->
      <path d="M-30,-30 H30 V30 H-30 Z M-10,-10 H10 V10 H-10 Z" fill="#FF9800" opacity="0" fill-rule="evenodd" class="sel-level-2"/>

      <!-- Ring 2 -->
      <path d="M-50,-50 H50 V50 H-50 Z M-30,-30 H30 V30 H-30 Z" fill="#FF9800" opacity="0" fill-rule="evenodd" class="sel-level-3"/>
  </g>
</svg>
