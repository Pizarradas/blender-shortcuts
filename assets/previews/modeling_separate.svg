  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Separate (P)</text>
  
  <g class="container" transform="translate(100,100)">
     <!-- Original Composite -->
