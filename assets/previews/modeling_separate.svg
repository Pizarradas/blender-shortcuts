        <rect x="-20" y="-20" width="40" height="40" fill="#FFCC80" stroke="#FF9800" stroke-width="2"/>
        <rect x="10" y="-40" width="20" height="20" fill="#FFCC80" stroke="#FF9800" stroke-width="2" class="part-to-separate"/>
     </g>
     
     <!-- Separated state (Hidden logic handled by animation moving 'part-to-separate') -->
  </g>
</svg>
