<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">UV Editing</text>
  
  <g transform="translate(100, 90)">
    <!-- UV Grid Background -->
    <defs>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ddd" stroke-width="1"/>
      </pattern>
    </defs>
    <rect x="-60" y="-60" width="120" height="120" fill="url(#grid)" stroke="#999" stroke-width="1"/>
    
    <!-- Unwrapped Mesh -->
    <polygon points="-40,-40 0,-50 40,-40 50,0 40,40 0,50 -40,40 -50,0" fill="#FFCC80" stroke="#FF9800" stroke-width="2" opacity="0.7"/>
    
    <!-- Selected Face -->
    <polygon points="0,0 40,-40 50,0" fill="#FF9800" opacity="0.8"/>
  </g>
</svg>
