<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Node Editor</text>
  
  <g transform="translate(100, 90)">
    <!-- Node A -->
    <rect x="-70" y="-30" width="60" height="40" rx="4" fill="#444" stroke="#000" stroke-width="1"/>
    <rect x="-70" y="-30" width="60" height="10" rx="4" fill="#e91e63"/>
    <circle cx="-10" cy="-10" r="4" fill="#8bc34a"/>
    
    <!-- Node B -->
    <rect x="10" y="10" width="60" height="40" rx="4" fill="#444" stroke="#000" stroke-width="1"/>
    <rect x="10" y="10" width="60" height="10" rx="4" fill="#2196f3"/>
    <circle cx="10" cy="30" r="4" fill="#8bc34a"/>
    
    <!-- Connection -->
    <path d="M-6,-10 C10,-10 -10,30 6,30" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
</svg>
