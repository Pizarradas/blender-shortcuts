<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="animated-preview">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Render / Shading</text>
  
  <!-- Material Sphere -->
  <circle cx="100" cy="90" r="50" fill="url(#grad1)" stroke="#ccc" stroke-width="1" class="target-element"/>
  
  <!-- Camera Frame -->
  <rect x="40" y="30" width="120" height="120" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>
  
  <defs>
    <radialGradient id="grad1" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:white;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </radialGradient>
  </defs>
</svg>
