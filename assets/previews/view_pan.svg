<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="animated-preview">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Pan (Shift+MMB)</text>
  
  <!-- Hand icon or similar to indicate panning -->
  <g class="target-element">
    <!-- Viewport Frame -->
    <rect x="50" y="50" width="100" height="80" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Object inside -->
    <circle cx="100" cy="90" r="20" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  </g>

  <!-- Pan Arrows -->
  <path d="M40,140 L160,140" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead)" marker-start="url(#arrowstart)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9800" />
    </marker>
    <marker id="arrowstart" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#FF9800" />
    </marker>
  </defs>
</svg>
