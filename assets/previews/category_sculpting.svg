<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Sculpting</text>
  
  <g transform="translate(100, 90)">
    <!-- Sculpt Sphere -->
    <circle cx="0" cy="0" r="45" fill="#BCAAA4"/>
    
    <!-- Brush Stroke Effect -->
    <path d="M-30,-20 Q0,-10 30,-20" fill="none" stroke="#8D6E63" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Cursor Ring -->
    <circle cx="0" cy="-15" r="35" fill="none" stroke="#D32F2F" stroke-width="2" stroke-dasharray="4"/>
    <line x1="0" y1="-15" x2="0" y2="-50" stroke="#D32F2F" stroke-width="2"/>
  </g>
</svg>
