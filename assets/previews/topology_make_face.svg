<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="animated-preview">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Make Face (F)</text>
  
  <g class="geometry" transform="translate(100,100) scale(1.5)">
     <!-- Vertices -->
     <circle cx="-30" cy="-30" r="3" fill="#000"/>
     <circle cx="30" cy="-30" r="3" fill="#000"/>
     <circle cx="30" cy="30" r="3" fill="#000"/>
     <circle cx="-30" cy="30" r="3" fill="#000"/>
     
     <!-- New Face -->
     <rect x="-30" y="-30" width="60" height="60" fill="#FF9800" opacity="0" stroke="none" class="new-face"/>
     
     <!-- Edges (Always visible) -->
     <path d="M-30,-30 L30,-30 L30,30 L-30,30 Z"fill="none" stroke="#333" stroke-width="2"/>
  </g>
</svg>
