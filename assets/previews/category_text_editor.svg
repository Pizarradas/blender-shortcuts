<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Text Editor</text>
  
  <g transform="translate(100, 90)">
    <!-- Code Window -->
    <rect x="-60" y="-50" width="120" height="90" rx="2" fill="#282c34" stroke="#999" stroke-width="1"/>
    <!-- Line Numbers -->
    <rect x="-60" y="-50" width="20" height="90" fill="#333"/>
    <!-- Syntax Highlighting Mockup -->
    <rect x="-30" y="-40" width="30" height="8" fill="#c678dd"/> <rect x="10" y="-40" width="40" height="8" fill="#61afef"/>
    <rect x="-30" y="-20" width="20" height="8" fill="#e06c75"/> <rect x="0" y="-20" width="60" height="8" fill="#98c379"/>
    <rect x="-30" y="0" width="80" height="8" fill="#d19a66"/>
    <rect x="-30" y="20" width="40" height="8" fill="#abb2bf"/>
  </g>
</svg>
