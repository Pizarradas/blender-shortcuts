<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Proportional Edit (O)</text>
  
  <g transform="translate(100, 100)">
    <!-- Falloff Curve (Gauss) -->
    <path d="M-80,40 Q-40,40 -20,0 T20,0 Q60,40 80,40" fill="none" stroke="#2196F3" stroke-width="3"/>
    
    <!-- Circle of Influence -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="4"/>
    
    <!-- Central Point -->
    <circle cx="0" cy="-20" r="4" fill="#FF9800"/>
    
    <!-- Affected Points (Mockup) -->
    <circle cx="-20" cy="-10" r="2" fill="#555"/>
    <circle cx="20" cy="-10" r="2" fill="#555"/>
    <circle cx="-40" cy="20" r="2" fill="#999"/>
    <circle cx="40" cy="20" r="2" fill="#999"/>
    <circle cx="-60" cy="35" r="2" fill="#ccc"/>
    <circle cx="60" cy="35" r="2" fill="#ccc"/>
    
    <!-- Icon representation -->
    <circle cx="-70" cy="-70" r="15" fill="#333" stroke="#fff" stroke-width="2"/>
    <path d="M-78,-70 Q-70,-80 -62,-70" fill="none" stroke="#fff" stroke-width="2" transform="translate(0,2)"/>
  </g>
</svg>
