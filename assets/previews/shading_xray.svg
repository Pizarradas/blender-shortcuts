<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Toggle X-Ray (Alt + Z)</text>
  
  <g transform="translate(100, 100)">
    <defs>
      <clipPath id="clip-half">
        <rect x="-50" y="-50" width="50" height="100"/>
      </clipPath>
    </defs>

    <!-- Solid Side (Right) -->
    <path d="M0,-40 L40,0 L0,40 L-40,0 Z" fill="#ccc" stroke="#999" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="#666"/>
    
    <!-- Overlay X-Ray (Left Half Cached) -->
    <g clip-path="url(#clip-half)">
        <!-- Translucent Cube -->
        <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#ff9800" stroke-width="2"/>
        <!-- Inner Structure visible -->
        <line x1="-40" y1="-40" x2="40" y2="40" stroke="#ff9800" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="-40" y1="40" x2="40" y2="-40" stroke="#ff9800" stroke-width="1" stroke-dasharray="2,2"/>
        <circle cx="0" cy="0" r="10" fill="#ff9800" opacity="0.5"/>
    </g>

    <!-- Split Line -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#333" stroke-width="2" stroke-dasharray="4"/>
    
    <!-- Labels -->
    <text x="-35" y="-50" font-family="sans-serif" font-size="10" fill="#ff9800">ON</text>
    <text x="35" y="-50" font-family="sans-serif" font-size="10" fill="#666">OFF</text>
  </g>
</svg>
