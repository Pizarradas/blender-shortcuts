<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="animated-preview">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Join (Ctrl + J)</text>
  
  <g class="objects-container" transform="translate(100, 100)">
    <!-- Object A -->
    <rect x="-40" y="-15" width="30" height="30" fill="#FFCC80" stroke="#FF9800" stroke-width="2" class="obj-a"/>
    <!-- Object B -->
    <circle cx="25" cy="0" r="15" fill="#90CAF9" stroke="#2196F3" stroke-width="2" class="obj-b"/>
    
    <!-- Unified Object (Hidden initially) -->
    <g class="obj-unified" opacity="0">
        <rect x="-40" y="-15" width="30" height="30" fill="#A5D6A7" stroke="#4CAF50" stroke-width="2"/>
        <circle cx="25" cy="0" r="15" fill="#A5D6A7" stroke="#4CAF50" stroke-width="2"/>
        <!-- Connection line implies logic union -->
        <path d="M-10,0 L10,0" stroke="#4CAF50" stroke-width="2"/> 
    </g>
  </g>
</svg>
