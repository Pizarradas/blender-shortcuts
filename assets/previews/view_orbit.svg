<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="animated-preview">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Orbit (MMB)</text>
  
  <!-- Grid/Floor -->
  <path d="M50,120 L150,120 M100,70 L100,170" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="4,4" transform="rotate(45, 100, 120)" class="floor-grid"/>

  <!-- Cube -->
  <g class="target-element">
    <rect x="85" y="85" width="30" height="30" fill="#2196F3" stroke="#1976D2" stroke-width="2"/>
    <path d="M85,85 L100,70 L130,70 L115,85" fill="#64B5F6" stroke="#1976D2" stroke-width="2"/>
    <path d="M115,85 L130,70 L130,100 L115,115" fill="#1E88E5" stroke="#1976D2" stroke-width="2"/>
  </g>
  
  <!-- Orbit Arrows -->
  <path d="M40,100 A60,20 0 1,1 160,100" fill="none" stroke="#FF9800" stroke-width="3" stroke-dasharray="0" class="orbit-path"/>
  <polygon points="160,100 155,95 165,95" fill="#FF9800" transform="rotate(90, 160, 100)"/>
</svg>
