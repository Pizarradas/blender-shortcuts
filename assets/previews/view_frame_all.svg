<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="animated-preview">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">Frame All (Home)</text>
  
  <!-- Group of objects -->
  <g class="scene-objects" transform="translate(100, 100) scale(1.5)">
      <!-- Objects spread out -->
      <circle cx="-60" cy="-40" r="15" fill="#90CAF9" stroke="#64B5F6"/>
      <rect x="40" y="30" width="30" height="30" fill="#A5D6A7" stroke="#81C784"/>
      <polygon points="0,-60 15,-30 -15,-30" fill="#FFCC80" stroke="#FFB74D"/>
      
      <!-- Central Cube -->
      <rect x="-15" y="-15" width="30" height="30" fill="#e0e0e0" stroke="#ccc"/>
  </g>

  <!-- Viewport Frame indicators -->
  <rect x="10" y="10" width="180" height="160" fill="none" stroke="#2196F3" stroke-width="2" stroke-dasharray="10,5" opacity="0" class="viewport-frame"/>
</svg>
